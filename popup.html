<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px sans-serif; width: 380px; padding: 12px; background: #f8f8f8; }
    input, button { width: 100%; margin: 5px 0; padding: 8px; font-size: 14px; box-sizing: border-box; }
    button { cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #999; }
    .status { 
      font-size: 13px; 
      color: #222; 
      white-space: pre-wrap; 
      min-height: 90px; 
      padding: 10px; 
      border: 2px solid #ccc; 
      border-radius: 6px; 
      background: #fff;
      margin-top: 8px;
      font-family: monospace;
    }
    .status.success { border-color: #4caf50; background: #e8f5e9; }
    .status.error { border-color: #f44336; background: #ffebee; }
    .debug { font-size: 11px; color: #666; margin-top: 8px; }
    h3 { margin-top: 0; }
  </style>
</head>
<body>
  <h3>悟空书签同步xbel-ByWebdav</h3>
  <input id="url" placeholder="完整文件路径 例如 https://webdav.123pan.cn/webdav/bookmarks.xbel">
  <input id="user" placeholder="用户名">
  <input id="pass" type="password" placeholder="密码">
  <button id="save">保存配置（会自动测试连接）</button>
  <button id="test">测试连接</button>

  <div class="debug"><b>操作结果（保持弹窗不要关）：</b></div>
  <div id="status" class="status">等待操作。</div>

  <button id="sync">立即同步</button>
  <button id="export">仅导出到云</button>
  <button id="import">仅从云导入</button>

  <div class="debug">
    • 默认已是 https://webdav.123pan.cn/webdav/bookmarks.xbel<br>
    • 先在123云盘WebDAV手动创建一个 bookmarks.xbel 文件<br>
    • 改完代码后必须 chrome://extensions 重新加载扩展<br>
    • 点击同步后按钮会立刻变“处理中...”，状态框会更新<br>
    • 想看详细日志：右键扩展图标 → 检查弹出式内容
  </div>
  <script src="popup.js"></script>
</body>
</html>
